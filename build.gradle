plugins {
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.0.1'
}

allprojects {
    ext.adventureVersion = '4.26.1'
    ext.adventureBukkitPlatformVersion = '4.4.1'

    group = 'ru.brikster'
    // Overridable from the release workflow: -PchattyVersion=3.0.0
    version = providers.gradleProperty('chattyVersion').getOrElse('3.0.0-SNAPSHOT')
}

subprojects {
    pluginManager.apply('java-library')

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_11

    tasks {
        compileJava {
            options.encoding = 'UTF-8'
        }

        compileTestJava {
            options.encoding = 'UTF-8'
        }

        test {
            useJUnitPlatform()
        }
    }

    repositories {
        mavenCentral()
        maven { url = 'https://hub.spigotmc.org/nexus/content/groups/public/' }
        maven {
            name = "sonatype-oss-snapshots1"
            url = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
        }
    }

    dependencies {
        compileOnlyApi 'org.jetbrains:annotations:17.0.0'

        implementation "net.kyori:adventure-api:$adventureVersion"
        implementation "net.kyori:adventure-text-minimessage:$adventureVersion"
        implementation "net.kyori:adventure-text-serializer-gson:$adventureVersion"
        implementation "net.kyori:adventure-platform-bukkit:$adventureBukkitPlatformVersion"

        compileOnly 'org.spigotmc:spigot-api:1.19-R0.1-SNAPSHOT'

        implementation 'com.google.inject:guice:5.1.0'
        implementation 'com.google.guava:guava:30.1-jre'

        compileOnly 'org.projectlombok:lombok:1.18.30'
        annotationProcessor 'org.projectlombok:lombok:1.18.30'

        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}