plugins {
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.0.1'
}

ext {
    minecraftVersion = (findProperty('minecraftVersion') ?: '1.21.11').toString()
    paperApiVersion = (findProperty('paperApiVersion') ?: "${minecraftVersion}-R0.1-SNAPSHOT").toString()
}

allprojects {
    group = 'ru.brikster'
    version = '3.0.0-SNAPSHOT'
}

subprojects {
    pluginManager.apply('java-library')

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_21

    tasks {
        compileJava {
            options.encoding = 'UTF-8'
        }

        compileTestJava {
            options.encoding = 'UTF-8'
        }
    }

    repositories {
        mavenCentral()
        maven { url = 'https://hub.spigotmc.org/nexus/content/groups/public/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven {
            name = "sonatype-oss-snapshots1"
            url = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
        }
    }

    def adventureVersion = "4.24.0"
    def adventureBukkitPlatformVersion = "4.4.1"

    dependencies {
        compileOnlyApi 'org.jetbrains:annotations:17.0.0'

        implementation "net.kyori:adventure-api:$adventureVersion"
        implementation "net.kyori:adventure-text-minimessage:$adventureVersion"
        implementation "net.kyori:adventure-text-serializer-gson:$adventureVersion"
        implementation "net.kyori:adventure-text-serializer-legacy:$adventureVersion"
        implementation "net.kyori:adventure-platform-bukkit:$adventureBukkitPlatformVersion"

        compileOnly "io.papermc.paper:paper-api:${rootProject.ext.paperApiVersion}"

        implementation 'com.google.inject:guice:5.1.0'
        implementation 'com.google.guava:guava:30.1-jre'

        compileOnly 'org.projectlombok:lombok:1.18.30'
        annotationProcessor 'org.projectlombok:lombok:1.18.30'
    }
}
